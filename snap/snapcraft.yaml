name: gemma4
base: core24
summary: Inference Snap for Gemma 4
description: See snapcraft.io/gemma4

adopt-info: version

grade: stable
confinement: strict
compression: lzo

assumes:
  - snapd2.68 # for components support

platforms:
  amd64:
  arm64:

slots:
  status:
    interface: content
    source:
      read:
        - &status-share $SNAP_DATA/share/status
  open-webui:
    interface: content
    content: open-webui-config
    source:
      read:
        - &owui-share $SNAP_DATA/share/open-webui

plugs:
  # To allow side-loading models into server (root daemon) from user home directory
  home:
    read: all

environment:
  SNAP_COMPONENTS: /snap/$SNAP_INSTANCE_NAME/components/$SNAP_REVISION
  ARCH_TRIPLET: $CRAFT_ARCH_TRIPLET_BUILD_FOR
  STATUS_SHARE: *status-share # Status directory shared via content interface
  OWUI_SHARE: *owui-share # Open WebUI config directory shared via content interface
  # This is to find the intel.icd file, containing the path to libigdrcl.so
  # Required for Intel GPU detection and communication
  OCL_ICD_VENDORS: $SNAP/etc/OpenCL/vendors

layout:
  # OpenCL looks in /etc/OpenCL/vendors for .icd files containing the paths to shared objects
  /etc/OpenCL/vendors:
    bind: $SNAP/etc/OpenCL/vendors
  # Intel icd files use an absolute path to Intel OpenCL shared objects. Use a layout to mount the so files at the expected location
  /usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl:
    bind: $SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR/intel-opencl
  # Under wsl the libraries are expected in /usr/lib/wsl
  /usr/lib/wsl:
    bind: $SNAP_COMMON/usr/lib/wsl

hooks:
  install:
    plugs: &install-plugs
      # For hardware detection
      - hardware-observe
      - opengl
  post-refresh:
    plugs: *install-plugs

parts:
  version:
    after: [cli]
    plugin: nil
    source: . # To regenerate the git hash on every change
    build-packages:
      - jq
      - git
    override-pull: |
      # Do nothing. This significantly reduces build time when sourcing large files.
    override-build: |
      set -eo pipefail
      cli_version=$($CRAFT_STAGE/bin/gemma4 version --format=json | jq .cli --raw-output)
      git_hash=$(git -C "$SNAPCRAFT_PROJECT_DIR" describe --always)
      craftctl set version="${cli_version#v}+${git_hash}"

  cli:
    source:
      - on amd64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.4/inference-snaps-cli-linux-amd64.tar.xz
      - on arm64: https://github.com/canonical/inference-snaps-cli/releases/download/v2.0.0-beta.4/inference-snaps-cli-linux-arm64.tar.xz
    plugin: dump
    override-build: |

      # For tab completion
      ln --symbolic ./modelctl bin/gemma4

      craftctl default

  cli-dependencies:
    plugin: nil
    stage-packages:
      - pciutils # lspci
      - clinfo # used for Intel GPU vRAM detection. It depends on intel-opencl-icd

  # Used for NVIDIA vRAM and CUDA Capability detection.
  # Only the binary is included to avoid staging libraries, which should instead be provided by the host through the opengl interface.
  cli-nvidia-smi:
    plugin: nil
    build-packages:
      - nvidia-utils-580
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      cp /usr/bin/nvidia-smi $CRAFT_PART_INSTALL/usr/bin/

      license_dir=$CRAFT_PART_INSTALL/usr/share/doc/nvidia-utils-580/
      mkdir -p $license_dir
      cp /usr/share/doc/nvidia-utils-580/copyright $license_dir/

  # OpenCL ICD and libigdgmm are required for Intel GPU vRAM lookup with clinfo.
  #
  # DRIVER VERSION: "Latest" = Intel Compute Runtime 26.22.38646.4 (public GitHub
  # release). The "Latest" driver here MUST match the one bundled by the
  # intel-compute-runtime part, otherwise clinfo (host-side vRAM detection) and
  # OVMS (inference) would use different Compute Runtime versions.
  cli-intel-opencl-icd:
    plugin: nil
    build-packages:
      - wget
    override-build: |
      if [ "$CRAFT_ARCH_BUILD_FOR" == "amd64" ]; then
        # ==============================================================
        # Legacy support ICD (compute-runtime 24.35.30872.36).
        #
        # COMPATIBILITY / CONFLICT NOTE:
        #   Do NOT download the legacy libigdgmm12_22.5.0 into the same
        #   directory as the latest libigdgmm12_22.10.0. `dpkg -i *.deb`
        #   installs in glob (alphabetical) order and "22.10" < "22.5" in
        #   ASCII, so 22.10.0 would install first and 22.5.0 would then
        #   DOWNGRADE over it. The legacy ICD only requires libigdgmm12
        #   (>= 22.5.0), so the latest 22.10.0 already satisfies it - we
        #   ship gmmlib ONCE, at the latest version.
        # ==============================================================
        mkdir -p "$CRAFT_PART_BUILD/icd-legacy"
        cd "$CRAFT_PART_BUILD/icd-legacy"
        wget -nv https://github.com/intel/compute-runtime/releases/download/24.35.30872.36/intel-opencl-icd-legacy1_24.35.30872.36_amd64.deb

        # ==============================================================
        # Latest ICD + gmmlib (compute-runtime 26.22.38646.4).
        # gmmlib 22.10.0 is installed here ONCE and satisfies both the
        # legacy and the latest ICD.
        # ==============================================================
        mkdir -p "$CRAFT_PART_BUILD/icd-latest"
        cd "$CRAFT_PART_BUILD/icd-latest"
        wget -nv https://github.com/intel/compute-runtime/releases/download/26.22.38646.4/intel-opencl-icd_26.22.38646.4-0_amd64.deb
        wget -nv https://github.com/intel/compute-runtime/releases/download/26.22.38646.4/libigdgmm12_22.10.0_amd64.deb

        # Install legacy FIRST, then latest, so the latest libraries win any
        # file-level overlaps. Separate directories + two dpkg calls keep the
        # ordering explicit (never rely on *.deb glob order across versions).
        dpkg --root="$CRAFT_PART_INSTALL" --force-all -i "$CRAFT_PART_BUILD/icd-legacy"/*.deb
        dpkg --root="$CRAFT_PART_INSTALL" --force-all -i "$CRAFT_PART_BUILD/icd-latest"/*.deb

        # If a driver generation drops IGC libraries (libigc/libigdfcl/libiga64)
        # into /usr/local/lib, that path is NOT on the snap's loader path (only
        # /usr/lib/$ARCH_TRIPLET is). Move them so NEO can link them at runtime.
        arch_libdir="$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
        if [ -d "$CRAFT_PART_INSTALL/usr/local/lib" ]; then
          mkdir -p "$arch_libdir"
          mv -n "$CRAFT_PART_INSTALL"/usr/local/lib/lib*.so* "$arch_libdir"/ 2>/dev/null || true
          rmdir "$CRAFT_PART_INSTALL"/usr/local/lib 2>/dev/null || true
        fi

        # Installing the ICD may create an absolute etc/alternatives/ocloc
        # symlink (-> /usr/bin/ocloc-<ver>) that points outside the snap and
        # fails store review. Drop ONLY that symlink; keep the real ocloc binary
        # (NEO/IGC need ocloc at runtime) and repoint usr/bin/ocloc with a
        # RELATIVE link that stays inside the snap.
        rm -f "$CRAFT_PART_INSTALL/etc/alternatives/ocloc"
        ocloc_real="$(ls "$CRAFT_PART_INSTALL"/usr/bin/ocloc-* 2>/dev/null | head -n1 || true)"
        if [ -n "$ocloc_real" ]; then
          rm -f "$CRAFT_PART_INSTALL/usr/bin/ocloc"
          ln -sf "$(basename "$ocloc_real")" "$CRAFT_PART_INSTALL/usr/bin/ocloc"
        fi
      fi

      craftctl default

  webui:
    plugin: dump
    source: https://github.com/canonical/inference-snaps-webui/releases/download/v1.0.0/inference-snaps-webui.tar.xz
    organize:
      "*": webui/

  engines:
    source: engines
    plugin: dump
    organize:
      "*": engines/

  models:
    source: models
    plugin: dump
    organize:
      "*": models/

  runtimes:
    source: runtimes
    plugin: dump
    organize:
      "*": runtimes/

  scripts:
    source: scripts
    plugin: dump
    stage-packages:
      - jq
    organize:
      "server.sh": bin/
      "server-webui.sh": bin/
      "export-shared-configs.sh": bin/

  model-e4b-it-int4-ov-1-of-2:
    plugin: dump
    source: components/model-e4b-it-int4-ov/gemma4-e4b-it-int4-ov
    organize:
      "*": (component/model-e4b-it-int4-ov-1-of-2)/
    prime:
      - "-(component/model-e4b-it-int4-ov-1-of-2)/openvino_text_embeddings*"
      - "*"

  model-e4b-it-int4-ov-2-of-2:
    plugin: dump
    source: components/model-e4b-it-int4-ov/gemma4-e4b-it-int4-ov
    organize:
      "openvino_text_embeddings*": (component/model-e4b-it-int4-ov-2-of-2)/
    prime:
      - "(component/model-e4b-it-int4-ov-2-of-2)/openvino_text_embeddings*"
      - -*

  openvino-model-server:
    plugin: dump
    source: https://github.com/openvinotoolkit/model_server/releases/download/v2026.2.1/ovms_ubuntu24_2026.2.1_python_off.tar.gz
    stage-packages:
      - libxml2
      - libcurl4
    organize:
      # move everything, including the staged packages
      "LICENSE": usr/share/doc/openvino-model-server
      "*": (component/openvino-model-server)
    # This part is only for amd64
    override-pull: &amd64-only |
      [ "$CRAFT_ARCH_BUILD_FOR" == "amd64" ] && craftctl default || exit 0
    override-build: *amd64-only
    override-stage: *amd64-only
    override-prime: *amd64-only

  # For Intel GPU usage, amd64 only
  #
  # DRIVER VERSION: "Latest" = Intel Compute Runtime 26.22.38646.4 + matching
  # IGC 2.36.3. This MUST match the cli-intel-opencl-icd part's 26.22 driver.
  intel-compute-runtime:
    plugin: nil
    build-packages:
      - wget
    stage-packages:
      - on amd64:
          - ocl-icd-libopencl1
    override-build: |
      if [ "$CRAFT_ARCH_BUILD_FOR" == "amd64" ]; then
        # ==============================================================
        # Legacy compute stack (compute-runtime 24.35.30872.36 + IGC 1.0.x).
        # Installed FIRST so the latest can override any older libraries.
        # ==============================================================
        mkdir -p "$CRAFT_PART_BUILD/opencl-intel-legacy1"
        cd "$CRAFT_PART_BUILD/opencl-intel-legacy1"
        wget -nv https://github.com/intel/intel-graphics-compiler/releases/download/igc-1.0.17537.24/intel-igc-core_1.0.17537.24_amd64.deb
        wget -nv https://github.com/intel/intel-graphics-compiler/releases/download/igc-1.0.17537.24/intel-igc-opencl_1.0.17537.24_amd64.deb
        wget -nv https://github.com/intel/compute-runtime/releases/download/24.35.30872.36/intel-level-zero-gpu-legacy1_1.5.30872.36_amd64.deb
        dpkg --root="$CRAFT_PART_INSTALL" --force-all -i *.deb

        # ==============================================================
        # Latest compute stack (compute-runtime 26.22.38646.4 + IGC 2.36.3).
        #
        # COMPATIBILITY NOTE: the "-2" IGC packages (intel-igc-core-2 /
        # intel-igc-opencl-2) are a NEW package generation that co-installs
        # alongside the legacy "intel-igc-core" / "intel-igc-opencl" (different
        # package names, no conflict). intel-ocloc 26.22 and libze-intel-gpu1
        # 26.22 must come from the SAME 26.22 release as the ICD in the
        # cli-intel-opencl-icd part.
        # ==============================================================
        mkdir -p "$CRAFT_PART_BUILD/opencl-intel"
        cd "$CRAFT_PART_BUILD/opencl-intel"
        wget -nv https://github.com/intel/intel-graphics-compiler/releases/download/v2.36.3/intel-igc-core-2_2.36.3+21719_amd64.deb
        wget -nv https://github.com/intel/intel-graphics-compiler/releases/download/v2.36.3/intel-igc-opencl-2_2.36.3+21719_amd64.deb
        wget -nv https://github.com/intel/compute-runtime/releases/download/26.22.38646.4/intel-ocloc_26.22.38646.4-0_amd64.deb
        wget -nv https://github.com/intel/compute-runtime/releases/download/26.22.38646.4/libze-intel-gpu1_26.22.38646.4-0_amd64.deb
        dpkg --root="$CRAFT_PART_INSTALL" --force-all -i *.deb

        # Same IGC-libdir safeguard as the cli-intel-opencl-icd part: move any
        # IGC .so from /usr/local/lib onto the snap's loader path.
        arch_libdir="$CRAFT_PART_INSTALL/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR"
        if [ -d "$CRAFT_PART_INSTALL/usr/local/lib" ]; then
          mkdir -p "$arch_libdir"
          mv -n "$CRAFT_PART_INSTALL"/usr/local/lib/lib*.so* "$arch_libdir"/ 2>/dev/null || true
          rmdir "$CRAFT_PART_INSTALL"/usr/local/lib 2>/dev/null || true
        fi

        cd "$CRAFT_PART_BUILD"
      fi # End of Intel Compute Runtime installation

      craftctl default
    organize:
      # move everything, including the staged packages
      "*": (component/openvino-model-server)

  notice:
    plugin: nil
    source: NOTICE
    source-type: file
    override-build: |
      license_dir=$CRAFT_PART_INSTALL/usr/share/doc
      mkdir -p $license_dir
      cp NOTICE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/LICENSE $license_dir/
      cp $SNAPCRAFT_PROJECT_DIR/LICENSE-gemma4 $license_dir/

components:

  model-e4b-it-int4-ov-1-of-2: &model-e4b-it-int4-ov
    type: standard
    summary: Google Gemma 4 E4B INT4 OpenVINO format
    description: Model weights for Google Gemma 4 E4B (Efficient 4B) in OpenVINO format, quantized to INT4

  model-e4b-it-int4-ov-2-of-2:
    <<: *model-e4b-it-int4-ov

  openvino-model-server:
    type: standard
    summary: OpenVINO Model Server
    description: OpenVINO Model Server for serving models

apps:
  gemma4:
    command: bin/gemma4
    completer: bin/snap-completer.bash
    plugs:
      - hardware-observe
      - opengl
      - network
      - desktop # To open the webui in the browser
    environment:
      ADDITIONAL_FEATURES: chat, webui

  server:
    command: bin/server.sh
    daemon: simple
    plugs:
      - network-bind
      - hardware-observe
      - opengl
      - process-control
      - home

  server-webui:
    command: bin/server-webui.sh
    daemon: simple
    plugs:
      - network-bind